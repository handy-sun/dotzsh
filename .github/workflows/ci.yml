name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - run: nix flake check

  build-and-verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14

      - name: Build cm-init
        run: nix build .#cm-init
      - name: Build fish-init
        run: nix build .#fish-init

      - name: Generate common.sh
        run: nix run .#cm-init -- -3
      - name: Generate common.fish
        run: nix run .#fish-init -- -3gp

      - name: Syntax check common.sh
        run: nix develop --command bash -c 'bash -n /tmp/common.sh && zsh -n /tmp/common.sh'
      - name: Syntax check common.fish
        run: nix develop --command fish --no-execute /tmp/common.fish

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14

      - name: Run consistency tests
        run: nix develop --command bash tests/consistency_fixes.sh

      - name: Run localpost Bash regression test
        run: nix develop --command bash tests/localpost_bash.sh

      - name: shellcheck common.sh.in
        run: nix develop --command shellcheck -S warning common.sh.in
      - name: shellcheck common.fish.in
        run: nix develop --command shellcheck -S warning common.fish.in
